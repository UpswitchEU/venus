name: Quality Guard

on:
  pull_request:
    paths:
      - "app/**"
      - "src/**"
      - "scripts/**"
      - "docs/architecture/file-size-baseline.json"
      - "docs/architecture/type-debt-baseline.json"
      - "docs/architecture/debug-surface-baseline.json"
      - ".github/workflows/quality-guard.yml"
      - ".gitignore"
      - ".env.example"
      - ".env.staging.example"
      - "biome.json"
      - "env.example"
      - "env.unlimited.example"
      - "next.config.js"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
  push:
    paths:
      - "app/**"
      - "src/**"
      - "scripts/**"
      - "docs/architecture/file-size-baseline.json"
      - "docs/architecture/type-debt-baseline.json"
      - "docs/architecture/debug-surface-baseline.json"
      - ".github/workflows/quality-guard.yml"
      - ".gitignore"
      - ".env.example"
      - ".env.staging.example"
      - "biome.json"
      - "env.example"
      - "env.unlimited.example"
      - "next.config.js"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.6"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.26.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard repo hygiene
        run: pnpm run guard:repo-hygiene

      - name: Guard secret hygiene
        run: pnpm run guard:secret-hygiene

      - name: Guard auth surface
        run: pnpm run guard:auth-surface

      - name: Guard browser persistence
        run: pnpm run guard:browser-persistence

      - name: Guard debug surface
        run: pnpm run guard:debug-surface

      - name: Guard security headers
        run: pnpm run guard:security-headers

      - name: Guard type debt
        run: pnpm run guard:type-debt

      - name: Guard file size
        run: pnpm run guard:file-size

      - name: Production dependency audit
        run: pnpm run audit

      - name: Type check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test:run

      - name: Build
        run: pnpm run build

      - name: Guard bundle budget
        run: pnpm run guard:bundle-budget
